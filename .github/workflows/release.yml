name: Automated Release & Publish Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Package & Publish to Open VSX & GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Syntax Check
        run: |
          node -c src/extension.js
          node -c src/services/contextEngine.js
          node -c src/services/quotaService.js
          node -c src/services/tokenScanner.js

      - name: Package VSIX Extension
        run: |
          npx -y @vscode/vsce package --no-dependencies

      - name: Extract Tag & VSIX Path
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "vsix_file=antigravity-cockpit-${VERSION}.vsix" >> $GITHUB_OUTPUT

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx -y ovsx publish "${{ steps.vars.outputs.vsix_file }}" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vars.outputs.vsix_file }}
          generate_release_notes: true
          draft: false
          prerelease: false
